server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: let React Router handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for hashed static assets.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Do not cache the HTML shell so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # NOTE: /api requests are NOT proxied here. In the cluster, the Ingress
    # routes akk.kercheval.cc/api -> the ws-akk-api Service, so the frontend's
    # same-origin fetch("/api/...") reaches the backend without CORS or a
    # baked-in API URL. See the akk-gitops ingress manifests.
}
